name-template: 'Production Release — $DATE'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: "### What's New"
    labels:
      - 'feature'
    change-template: |
      * **$TITLE**
        $BODY
  - title: '### $VALUE'
    labels:
      - 'improvement/*'
    change-template: |
      * **$TITLE**
        $BODY

# This handles anything NOT labeled 'feature' or 'improvement/*'
# We remove (@$AUTHOR) here to ensure it never shows up.
change-template: '* $TITLE'

template: |
  # Production Release — $DATE

  $CHANGES
