name-template: 'Production Release — $DATE'
tag-template: 'v$RESOLVED_VERSION'

categories:
  # ===== What's New =====
  - title: "### What's new"
    labels:
      - 'feature'
    change-template: |
      **$TITLE**
      $BODY

  # ===== Changes =====
  - title: "#### Screening"
    labels:
      - 'screening'
    change-template: |
      * **[$TYPE]** $TITLE

  - title: "#### Credits & Billing"
    labels:
      - 'credits'
      - 'billing'
    change-template: |
      * **[$TYPE]** $TITLE

  - title: "#### ATS"
    labels:
      - 'ats'
      - 'integration'
    change-template: |
      * **[$TYPE]** $TITLE

  - title: "#### Core Platform"
    labels:
      - 'core'
      - 'platform'
    change-template: |
      * **[$TYPE]** $TITLE

# ===== Unlabeled fallback =====
change-template: |
  * $TITLE

template: |
  # Production Release — $DATE

  ### What's new
  $CHANGES

  ### Changes
  $UNCATEGORIZED_CHANGES
