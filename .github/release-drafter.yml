name-template: 'Production Release — $DATE'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: "### What's New"
    labels:
      - 'feature'
    # This override adds the PR body/description specifically for this category
    change-template: |
      * **$TITLE**
        $BODY
  - title: '#### $VALUE' 
    labels:
      - 'area/*'
    # Standard items only get the title
    change-template: '* $TITLE'

template: |
  # Production Release — $DATE

  $CHANGES
