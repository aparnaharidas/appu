name: Release Drafter to File

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  update_release_file:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      # 1. Run Release Drafter with correct config
      - uses: release-drafter/release-drafter@v5
        id: drafter
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Checkout repo
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. Create changelog file
      - name: Create Changelog File
        run: |
          DATE=$(date +'%Y-%m-%d')
          mkdir -p ./changelogs
          echo "${{ steps.drafter.outputs.body }}" > ./changelogs/${DATE}.md

      # 4. Commit file
      - name: Commit changelog
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ./changelogs/*.md
          git commit -m "chore: add changelog for ${DATE}" || echo "No changes to commit"
          git push
